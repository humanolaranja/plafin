name: plafin
description: Plafin - Planejamento Financeiro. Organize seus ciclos de receitas e despesas.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  bloc: ^9.2.1
  equatable: ^3.0.0
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/logo_rounded.png
    - assets/branding/icon_foreground.png

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf

# Ícones: dart run flutter_launcher_icons   (fontes geradas por tool/generate_icons.py)
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: ic_launcher
  min_sdk_android: 21
  adaptive_icon_background: assets/branding/icon_background.png
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#17120F"
    theme_color: "#C2410C"
  windows:
    generate: true
    image_path: assets/branding/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/icon.png

# Splash: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFBF8"
  color_dark: "#17120F"
  image: assets/branding/logo_rounded.png
  android_12:
    color: "#FFFBF8"
    color_dark: "#17120F"
    image: assets/branding/splash_glyph.png
    icon_background_color: "#EE5316"
    icon_background_color_dark: "#EE5316"
  web: true
