name: plafin
description: Plafin - Planejamento Financeiro. Organize seus ciclos de receitas e despesas.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  bloc: ^9.2.1
  equatable: ^3.0.0
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
